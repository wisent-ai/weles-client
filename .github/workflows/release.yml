name: release

on:
  push:
    tags: [ "v*" ]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert tag matches package version
        run: |
          declared="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$declared" ]; then
            printf '%s\n' "tag $GITHUB_REF_NAME does not match package version $declared"
            false
          fi
      - name: Package immutable client artifact
        run: |
          archive="$(npm pack --silent)"
          openssl dgst -sha256 -r "$archive" > "$archive.sha256"
          printf '%s\n' "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256"
