name: release

on:
  push:
    tags: [ "v*" ]

concurrency:
  group: weles-client-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require allowlisted release operator
        env:
          ACTOR: ${{ github.actor }}
          APPROVERS: ${{ vars.WELES_RELEASE_APPROVERS }}
        run: |
          test -n "$APPROVERS" || {
            echo "WELES_RELEASE_APPROVERS repository variable is empty" >&2
            exit 1
          }
          printf '%s\n' "$APPROVERS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -Fqx "$ACTOR" || {
              echo "$ACTOR is not an allowlisted Weles release operator" >&2
              exit 1
            }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org
      - name: Assert tag matches package version
        run: |
          declared="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$declared" ]; then
            printf '%s\n' "tag $GITHUB_REF_NAME does not match package version $declared"
            false
          fi
      - name: Package immutable client artifact
        run: |
          archive="$(npm pack --silent)"
          openssl dgst -sha256 -r "$archive" > "$archive.sha256"
          printf '%s\n' "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Publish npm package with provenance
        run: npm publish --access public --provenance
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256"
